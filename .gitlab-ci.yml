stages:
  - lint
  - test
  - build
  - docker
  - deploy

variables:
  NODE_VERSION: "20"
  DOCKER_DRIVER: overlay2

# Lint stage
lint:frontend:
  stage: lint
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci || npm install
    - npx eslint . --max-warnings=10 || true
  only:
    - main
    - merge_requests

lint:backend:
  stage: lint
  image: node:20-alpine
  script:
    - cd backend
    - npm ci || npm install
  only:
    - main
    - merge_requests

# Test stage
test:backend:
  stage: test
  image: node:20-alpine
  services:
    - name: mysql:8.0
      alias: mysql-test
  variables:
    MYSQL_DATABASE: university_test_db
    MYSQL_USER: test_user
    MYSQL_PASSWORD: test_password
    MYSQL_ROOT_PASSWORD: root_password
  script:
    - cd backend
    - npm ci || npm install
    - node -e "console.log('Running backend health checks...')"
  only:
    - main
    - merge_requests

# Build stage
build:frontend:
  stage: build
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci || npm install
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week
  only:
    - main
    - merge_requests

# Docker build stage
docker:build:
  stage: docker
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - docker build -t university-backend:latest ./backend
    - docker build -t university-frontend:latest ./frontend
  only:
    - main
  when: manual

# Deploy stage
deploy:staging:
  stage: deploy
  script:
    - echo "Deploying University Management Stack to Staging environment..."
  environment:
    name: staging
  only:
    - main
  when: manual
