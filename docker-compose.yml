services:
  mysql-db:
    image: mysql:8.0
    container_name: university-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: university_db
      MYSQL_USER: uni_user
      MYSQL_PASSWORD: uni_password_123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u uni_user -puni_password_123 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - university-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: university-backend
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_USER: uni_user
      DB_PASSWORD: uni_password_123
      DB_NAME: university_db
      NODE_ENV: production
    networks:
      - university-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: university-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - university-network

volumes:
  mysql_data:
    driver: local

networks:
  university-network:
    driver: bridge

